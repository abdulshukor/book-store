[project]
name = "book-store-backend"
version = "0.0.0"
description = "Backend API for book-store"
readme = "README.md"
authors = [{ name = "Abdul Shukor", email = "Abdul@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.3",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
book-store-backend-api = "backend.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "backend"
